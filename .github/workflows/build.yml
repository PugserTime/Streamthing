name: Build Pi Media Center

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Validate web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: pi-media-center-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    name: Build portable Windows app
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Windows executable
        run: npm run build:exe

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/MediaCenter.exe')) {
            throw 'Build completed without dist/MediaCenter.exe'
          }
          $file = Get-Item 'dist/MediaCenter.exe'
          if ($file.Length -lt 1000000) {
            throw "Executable looks unexpectedly small: $($file.Length) bytes"
          }
          Write-Host "Built $($file.FullName) ($($file.Length) bytes)"

      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Media-Center-Windows-x64
          path: dist/MediaCenter.exe
          if-no-files-found: error
          retention-days: 30
